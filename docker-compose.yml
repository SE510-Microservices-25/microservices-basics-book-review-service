services:
  review-service:
    build: ./ReviewService
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:latest
    container_name: review-postgres
    restart: always
    environment:
      POSTGRES_USER: review_user
      POSTGRES_PASSWORD: review_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U review_user"]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  postgres-data:
