services:
  books:
    build: ./BooksService
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  postgres:
    image: postgres:latest
    container_name: books-postgres
    restart: always
    environment:
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: books_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U books_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
