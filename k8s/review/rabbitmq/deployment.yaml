apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-rabbitmq
  template:
    metadata:
      labels:
        app: review-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
