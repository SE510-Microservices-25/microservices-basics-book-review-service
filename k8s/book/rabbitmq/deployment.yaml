apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-rabbitmq
  template:
    metadata:
      labels:
        app: book-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
