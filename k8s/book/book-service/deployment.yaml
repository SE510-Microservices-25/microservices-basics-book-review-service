apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:latest
          command: ['sh', '-c', 'until pg_isready -h book-postgres -p 5432 -U book_user; do echo waiting for postgres; sleep 2; done;']
        - name: wait-for-rabbitmq
          image: busybox
          command: [ 'sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;' ]
      containers:
        - name: book-service
          image: book-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: RabbitMQ__Host
              value: "rabbitmq"
            - name: RabbitMQ__Username
              value: "guest"
            - name: RabbitMQ__Password
              value: "guest"
            - name: MessageBus__ServiceSecretKey
              valueFrom:
                secretKeyRef:
                  name: book-service-secret
                  key: service-key
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: book-postgres-secret
                  key: connection-string
